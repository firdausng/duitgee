<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="DuitGee">
  <style>
    :root { --line: #1F1A14; --ox: #6B2118; }
    @media (prefers-color-scheme: dark) {
      :root { --line: #F2EADC; --ox: #C56B5D; }
    }
    .ring   { fill: none; stroke: var(--line); stroke-width: 1.75; }
    .n-half { fill: var(--ox); }
    .s-half { fill: var(--line); }
    .orb    { fill: var(--ox); }
  </style>

  <circle class="ring" cx="16" cy="16" r="14" />
  <polygon class="n-half" points="16,4 20,16 12,16" />
  <polygon class="s-half" points="16,28 20,16 12,16" />
  <circle class="orb" cx="16" cy="16" r="1.6" />
</svg>
